services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: protheus-pc-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/referencias:/app/data/referencias
      - ./data/tmp:/app/data/tmp
    environment:
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      - REFERENCIAS_DIR=/app/data/referencias
      - TMP_DIR=/app/data/tmp
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-20}
      - MAX_FILES_POR_PROCESSAMENTO=${MAX_FILES_POR_PROCESSAMENTO:-20}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: protheus-pc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    command: npm run dev
